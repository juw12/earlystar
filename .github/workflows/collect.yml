name: Collect and deploy

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # push the database to the data branch
  pages: write
  id-token: write

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore history database from the data branch
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data:refs/remotes/origin/data; then
            git show origin/data:reporadar.db > data/reporadar.db
            echo "Restored $(du -h data/reporadar.db | cut -f1) database"
          else
            echo "No data branch yet, starting a fresh history"
          fi

      - name: Collect GitHub Trending and search snapshots
        run: python3 collector.py --once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save history database to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          workdir=$(mktemp -d)
          cp data/reporadar.db "$workdir/"
          cd "$workdir"
          git init -q -b data
          git add reporadar.db
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "History snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build static site
        run: python3 export_static.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
